<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EnsoAI 远程共享</title>
<link rel="stylesheet" href="xterm.css">
<style>
:root {
  --bg: #0a0a0a;
  --bg-card: #161616;
  --bg-input: #1e1e1e;
  --bg-hover: #262626;
  --bg-elevated: #1c1c1c;
  --text: #ededed;
  --text-secondary: #a0a0a0;
  --text-dim: #666;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-muted: rgba(99,102,241,0.12);
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --border: #2a2a2a;
  --border-light: #333;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ── Login ── */
.login-page {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; height: 100dvh; padding: 24px 20px;
  padding-top: calc(24px + var(--safe-top));
}
.login-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px 28px;
  width: 100%; max-width: 400px; text-align: center;
}
.login-logo { font-size: 48px; margin-bottom: 16px; }
.login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
.login-card .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
.login-card input {
  width: 100%; padding: 14px 16px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s;
}
.login-card input:focus { border-color: var(--accent); }
.login-card input::placeholder { color: var(--text-dim); }
.login-card .btn-primary {
  width: 100%; padding: 14px; margin-top: 16px;
  background: var(--accent); color: white; border: none;
  border-radius: var(--radius-sm); font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background 0.2s;
}
.login-card .btn-primary:hover { background: var(--accent-hover); }
.login-card .btn-primary:active { transform: scale(0.98); }
.login-card .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.login-error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 20px; }

/* ── App Shell ── */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* Top bar with connection status */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; height: 52px;
  padding-top: var(--safe-top);
}
.top-bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-bar-title {
  font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conn-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-secondary);
  padding: 4px 10px; border-radius: 20px;
  background: var(--bg-input); flex-shrink: 0;
}
.conn-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.conn-status.connected .conn-dot { background: var(--success); }
.conn-status.reconnecting .conn-dot {
  background: var(--warning);
  animation: pulse 1.5s ease-in-out infinite;
}
.conn-status.disconnected .conn-dot { background: var(--danger); }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
.btn-icon {
  background: none; border: none; color: var(--text-secondary);
  cursor: pointer; padding: 8px; border-radius: var(--radius-xs);
  font-size: 16px; line-height: 1; transition: all 0.15s;
}
.btn-icon:hover { background: var(--bg-hover); color: var(--text); }

/* ── Content ── */
.content {
  flex: 1; overflow: hidden; position: relative;
}

/* ── Views ── */
.view { display: none; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.view.active { display: flex; flex-direction: column; }

/* ── Bottom Tab Bar (Happy-style) ── */
.tab-bar {
  display: flex; background: var(--bg-card);
  border-top: 1px solid var(--border);
  flex-shrink: 0; height: 56px;
  padding-bottom: var(--safe-bottom);
}
.tab-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 10px; font-weight: 500;
  transition: color 0.2s; padding: 8px 0;
  -webkit-tap-highlight-color: transparent;
}
.tab-item:hover { color: var(--text-secondary); }
.tab-item.active { color: var(--accent); }
.tab-icon { font-size: 22px; line-height: 1; }
.tab-label { letter-spacing: 0.3px; }

/* ── Session List ── */
.session-list-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 8px; flex-shrink: 0;
}
.session-list-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.session-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 16px; }

/* Session cards */
.session-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  cursor: pointer; transition: all 0.15s; position: relative;
}
.session-card:hover { border-color: var(--accent); background: var(--bg-elevated); }
.session-card:active { transform: scale(0.98); }
.session-card-top { display: flex; align-items: center; gap: 10px; }
.session-card-icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: var(--accent-muted); display: flex;
  align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.session-card-info { flex: 1; min-width: 0; }
.session-card-name {
  font-size: 14px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-card-path {
  font-size: 12px; color: var(--text-dim); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-card-badge {
  font-size: 11px; padding: 3px 8px; border-radius: 12px; flex-shrink: 0;
}
.session-card-badge.local { background: rgba(99,102,241,0.12); color: var(--accent); }
.session-card-badge.remote { background: rgba(34,197,94,0.12); color: var(--success); }
.session-card-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-destructive-sm {
  padding: 6px 10px; background: none; border: 1px solid var(--danger);
  color: var(--danger); border-radius: var(--radius-xs);
  font-size: 12px; cursor: pointer; opacity: 0.7; transition: opacity 0.15s;
}
.btn-destructive-sm:hover { opacity: 1; }

/* FAB (Happy FABWide style) */
.fab {
  position: fixed; bottom: calc(72px + var(--safe-bottom)); right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: white; border: none;
  font-size: 24px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  transition: all 0.2s; z-index: 5;
}
.fab:hover { background: var(--accent-hover); transform: scale(1.05); }
.fab:active { transform: scale(0.95); }

/* ── Push View (terminal detail) ── */
.push-view {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg); z-index: 10;
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
}
.push-view.active { transform: translateX(0); }

/* Terminal detail header */
.terminal-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; height: 48px;
}
.terminal-header .btn-back {
  background: none; border: none; color: var(--accent);
  font-size: 14px; cursor: pointer; padding: 6px 8px;
  border-radius: var(--radius-xs); font-weight: 500;
}
.terminal-header .btn-back:hover { background: var(--accent-muted); }
.terminal-header-path {
  flex: 1; font-size: 13px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.terminal-header-status { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }

/* Terminal body */
.terminal-body { flex: 1; overflow: hidden; }
.terminal-body .xterm { height: 100%; }

/* Composer (Happy AgentInput style) */
.composer {
  background: var(--bg-card); border-top: 1px solid var(--border);
  flex-shrink: 0;
  padding-bottom: var(--safe-bottom);
}
.composer-row {
  display: flex; gap: 8px; padding: 8px 12px; align-items: flex-end;
}
.composer-input {
  flex: 1; padding: 10px 14px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 20px;
  color: var(--text); font-size: 14px; outline: none;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  min-height: 40px; max-height: 100px; resize: none;
  line-height: 1.4;
}
.composer-input:focus { border-color: var(--accent); }
.composer-input::placeholder { color: var(--text-dim); }
.composer-send {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); color: white; border: none;
  font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s;
}
.composer-send:hover { background: var(--accent-hover); }
.composer-send:active { transform: scale(0.9); }
.composer-send:disabled { opacity: 0.3; cursor: not-allowed; }

/* Quick keys row */
.quick-keys {
  display: flex; gap: 4px; padding: 0 12px 8px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.quick-keys::-webkit-scrollbar { display: none; }
.quick-key {
  padding: 6px 12px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-xs);
  color: var(--text-secondary); font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: all 0.1s;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}
.quick-key:hover { border-color: var(--accent); color: var(--accent); }
.quick-key:active { background: var(--accent-muted); }

/* ── Project View ── */
.project-list-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 8px; flex-shrink: 0;
}
.project-list-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.project-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 16px; }

.project-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  cursor: pointer; transition: all 0.15s;
}
.project-card:hover { border-color: var(--accent); }
.project-card:active { transform: scale(0.98); }
.project-card.selected {
  border-color: var(--accent); background: var(--accent-muted);
}
.project-card-top { display: flex; align-items: center; gap: 10px; }
.project-card-name {
  font-size: 14px; font-weight: 600; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.project-card-badge {
  font-size: 11px; padding: 3px 8px; border-radius: 12px; flex-shrink: 0;
}
.project-card-badge.valid { background: rgba(34,197,94,0.12); color: var(--success); }
.project-card-badge.invalid { background: rgba(245,158,11,0.12); color: var(--warning); }
.project-card-path {
  font-size: 12px; color: var(--text-dim); margin-top: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.project-card-actions {
  display: flex; gap: 6px; margin-top: 8px;
}
.btn-xs {
  padding: 5px 10px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-xs);
  color: var(--text-secondary); font-size: 12px; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.btn-xs:hover { border-color: var(--accent); color: var(--accent); }

/* Project detail panel (expands below selected project) */
.project-detail {
  display: none; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin: 0 16px 6px; overflow: hidden;
}
.project-detail.active { display: block; }
.project-detail-tabs {
  display: flex; border-bottom: 1px solid var(--border);
}
.project-detail-tab {
  flex: 1; padding: 10px; text-align: center;
  background: none; border: none; color: var(--text-dim);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 0.15s; border-bottom: 2px solid transparent;
}
.project-detail-tab.active {
  color: var(--accent); border-bottom-color: var(--accent);
}
.project-detail-content { padding: 12px 0; max-height: 300px; overflow-y: auto; }

/* Git section */
.git-branch-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; font-size: 13px;
}
.git-branch-name { font-weight: 600; color: var(--accent); }
.git-ahead-behind { font-size: 12px; color: var(--text-dim); }
.section-label {
  font-size: 11px; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 0.5px; padding: 8px 16px 4px; font-weight: 600;
}
.git-file-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; font-size: 13px;
}
.git-file-item:hover { background: var(--bg-hover); }
.git-file-status {
  width: 20px; text-align: center; font-weight: 700;
  font-size: 12px; flex-shrink: 0;
}
.git-file-status.M { color: var(--warning); }
.git-file-status.A { color: var(--success); }
.git-file-status.D { color: var(--danger); }
.git-file-status.R { color: #a78bfa; }
.git-file-status.U { color: var(--text-dim); }
.git-file-path {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; cursor: pointer;
}
.git-file-path:hover { color: var(--accent); }
.git-file-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-outline-xs {
  padding: 3px 8px; background: none; border: 1px solid var(--border);
  color: var(--text-secondary); border-radius: var(--radius-xs);
  font-size: 11px; cursor: pointer; transition: all 0.15s;
  min-width: 28px; min-height: 28px;
  display: flex; align-items: center; justify-content: center;
}
.btn-outline-xs:hover { border-color: var(--accent); color: var(--accent); }
.git-commit-area { padding: 8px 16px 12px; }
.git-commit-area textarea {
  width: 100%; padding: 8px 12px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-xs);
  color: var(--text); font-size: 13px; outline: none;
  resize: vertical; min-height: 48px; font-family: inherit;
}
.git-commit-area textarea:focus { border-color: var(--accent); }
.git-commit-area .commit-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
.btn-commit {
  padding: 6px 16px; background: var(--accent); color: white;
  border: none; border-radius: var(--radius-xs);
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.btn-commit:hover { background: var(--accent-hover); }
.git-log-entry {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 16px; font-size: 13px;
}
.git-log-hash { font-family: monospace; color: var(--accent); flex-shrink: 0; font-size: 12px; }
.git-log-info { flex: 1; min-width: 0; }
.git-log-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.git-log-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* File section */
.path-bar {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 16px; font-size: 13px; color: var(--text-secondary);
  overflow-x: auto; white-space: nowrap; flex-shrink: 0;
}
.path-bar span { cursor: pointer; }
.path-bar span:hover { color: var(--accent); }
.path-sep { color: var(--text-dim); margin: 0 2px; }
.file-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; cursor: pointer; transition: background 0.1s;
  min-height: 44px;
}
.file-item:hover { background: var(--bg-hover); }
.file-item:active { background: var(--accent-muted); }
.file-icon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
.file-name { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-size { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
.dir-icon { color: #f0c040; }
.file-icon-default { color: var(--text-dim); }

/* ── Settings View ── */
.settings-section { padding: 16px; }
.settings-group {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.settings-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.settings-item:last-child { border-bottom: none; }
.settings-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.settings-value { font-size: 14px; font-family: 'SF Mono', monospace; word-break: break-all; }
.settings-footer {
  text-align: center; padding: 24px 16px; color: var(--text-dim);
}
.settings-footer p:first-child { font-size: 14px; margin-bottom: 4px; }
.settings-footer p:last-child { font-size: 12px; }

/* ── Overlays (file viewer, diff, folder picker) ── */
.overlay {
  display: none; flex-direction: column;
  height: 100%; position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 20; background: var(--bg);
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
}
.overlay.active { display: flex; transform: translateX(0); }
.overlay-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; height: 48px;
}
.overlay-header .btn-back {
  background: none; border: none; color: var(--accent);
  font-size: 14px; cursor: pointer; padding: 6px 8px;
  border-radius: var(--radius-xs); font-weight: 500;
}
.overlay-header .btn-back:hover { background: var(--accent-muted); }
.overlay-title {
  font-size: 14px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
.diff-content {
  flex: 1; overflow: auto; padding: 12px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-all;
}
.diff-line-added { background: rgba(34,197,94,0.12); color: #86efac; }
.diff-line-removed { background: rgba(239,68,68,0.12); color: #fca5a5; }
.diff-line-context { color: var(--text-dim); }
.file-viewer-content {
  flex: 1; overflow: auto; padding: 12px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-all;
}

/* ── Folder Picker ── */
.fp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--bg-card);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.fp-header h3 { font-size: 16px; font-weight: 700; }
.fp-path {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 16px; background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text-secondary);
  overflow-x: auto; white-space: nowrap; flex-shrink: 0;
}
.fp-path span { cursor: pointer; }
.fp-path span:hover { color: var(--accent); }
.fp-roots {
  display: flex; gap: 6px; padding: 8px 16px;
  overflow-x: auto; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.fp-root-chip {
  padding: 8px 16px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 20px;
  color: var(--text); font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: all 0.15s;
  min-height: 36px; display: flex; align-items: center;
}
.fp-root-chip:hover { border-color: var(--accent); color: var(--accent); }
.fp-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.fp-item {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.1s; min-height: 48px;
}
.fp-item:hover { background: var(--bg-hover); }
.fp-item:active { background: var(--accent-muted); }
.fp-item-icon { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }
.fp-item-name { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-item-badge {
  font-size: 10px; padding: 2px 6px; border-radius: 8px;
  background: rgba(34,197,94,0.15); color: var(--success); flex-shrink: 0;
}
.fp-item-arrow { color: var(--text-dim); font-size: 14px; flex-shrink: 0; }
.fp-footer {
  display: flex; gap: 8px; padding: 10px 16px;
  background: var(--bg-card); border-top: 1px solid var(--border);
  flex-shrink: 0; padding-bottom: calc(10px + var(--safe-bottom));
}
.fp-footer .btn-select {
  flex: 1; padding: 14px; background: var(--accent); color: white;
  border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.fp-footer .btn-select:hover { background: var(--accent-hover); }
.fp-footer .btn-select:disabled { opacity: 0.4; cursor: not-allowed; }
.fp-footer .btn-manual {
  padding: 14px 16px; background: none; border: 1px solid var(--border);
  color: var(--text-secondary); border-radius: var(--radius-sm);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.fp-footer .btn-manual:hover { border-color: var(--accent); color: var(--accent); }
.fp-loading { text-align: center; padding: 30px; color: var(--text-dim); font-size: 14px; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-dim); }
.empty-state .icon { font-size: 44px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
.empty-state .hint { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

/* ── Command run bar (in sessions tab) ── */
.command-bar {
  display: flex; gap: 8px; padding: 10px 16px;
  background: var(--bg-card); border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.command-bar input {
  flex: 1; padding: 10px 14px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 14px; outline: none;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}
.command-bar input:focus { border-color: var(--accent); }
.command-bar input::placeholder { color: var(--text-dim); }
.command-bar button {
  padding: 10px 18px; background: var(--accent); color: white;
  border: none; border-radius: var(--radius-sm);
  font-size: 14px; cursor: pointer; font-weight: 500;
}
.command-bar button:hover { background: var(--accent-hover); }
.command-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Toast ── */
.toast {
  position: fixed; top: calc(16px + var(--safe-top)); left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 20px;
  font-size: 14px; z-index: 100; opacity: 0;
  transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  max-width: 90vw; text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* ── Desktop (≥ 768px) ── */
@media (min-width: 768px) {
  .session-list, .project-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
  }
  .login-card { padding: 48px 40px; }
  .top-bar { padding: 0 24px; }
  .content { max-width: 960px; margin: 0 auto; width: 100%; }
  .fab { bottom: 80px; right: calc(50% - 460px); }
}
</style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Login Page -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <h1>EnsoAI 远程共享</h1>
    <p class="subtitle">输入访问令牌以连接</p>
    <input type="text" id="tokenInput" placeholder="请输入访问令牌" autocomplete="off">
    <button id="connectBtn" class="btn-primary" onclick="doConnect()">连接</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" class="app" style="display:none">
  <!-- Top bar with connection status -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="top-bar-title">EnsoAI</span>
    </div>
    <div class="conn-status connected" id="connStatus">
      <span class="conn-dot"></span>
      <span id="connText">已连接</span>
    </div>
  </div>

  <div class="content">
    <!-- Sessions View (default) -->
    <div id="sessionsView" class="view active">
      <div class="session-list-header">
        <h2>会话</h2>
      </div>
      <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <div id="sessionList" class="session-list"></div>
      </div>
      <div class="command-bar">
        <input type="text" id="commandInput" placeholder="运行命令（需先选择项目）" disabled>
        <button id="commandRunBtn" onclick="runCommand()" disabled>运行</button>
      </div>
    </div>

    <!-- Projects View -->
    <div id="projectsView" class="view">
      <div class="project-list-header">
        <h2>项目</h2>
        <button class="btn-xs" onclick="showAddProject()">+ 导入项目</button>
      </div>
      <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <div id="projectList" class="project-list"></div>
      </div>
    </div>

    <!-- Settings View -->
    <div id="settingsView" class="view">
      <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <div style="padding:16px 16px 8px"><h2 style="font-size:20px;font-weight:700;letter-spacing:-0.3px">设置</h2></div>
        <div class="settings-section">
          <div class="settings-group">
            <div class="settings-item">
              <div class="settings-label">连接地址</div>
              <div class="settings-value" id="settingsUrl">-</div>
            </div>
            <div class="settings-item">
              <div class="settings-label">当前项目</div>
              <div class="settings-value" id="settingsProject">未选择</div>
            </div>
            <div class="settings-item">
              <div class="settings-label">Token</div>
              <div class="settings-value" id="settingsToken">-</div>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <button class="btn-primary" style="width:100%;padding:14px;background:var(--danger);border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;border:none;color:white" onclick="doDisconnect()">断开连接</button>
        </div>
        <div class="settings-footer">
          <p>EnsoAI 远程共享</p>
          <p>WebSocket + bore 隧道</p>
        </div>
      </div>
    </div>

    <!-- Terminal Detail (push view) -->
    <div id="terminalView" class="push-view">
      <div class="terminal-header">
        <button class="btn-back" onclick="closeTerminal()">← 返回</button>
        <span class="terminal-header-path" id="terminalPath"></span>
        <span class="terminal-header-status" id="terminalStatus"></span>
      </div>
      <div class="terminal-body" id="terminalContainer"></div>
      <div class="composer">
        <div class="quick-keys" id="quickKeys">
          <button class="quick-key" onclick="sendSpecial('')">Ctrl+C</button>
          <button class="quick-key" onclick="sendSpecial('')">Ctrl+D</button>
          <button class="quick-key" onclick="sendSpecial('\t')">Tab</button>
          <button class="quick-key" onclick="sendSpecial('\x1b[A')">↑</button>
          <button class="quick-key" onclick="sendSpecial('\x1b[B')">↓</button>
          <button class="quick-key" onclick="sendSpecial('\x1b[D')">←</button>
          <button class="quick-key" onclick="sendSpecial('\x1b[C')">→</button>
        </div>
        <div class="composer-row">
          <textarea class="composer-input" id="composerInput" placeholder="输入命令…" rows="1"></textarea>
          <button class="composer-send" id="composerSend" onclick="sendComposer()" disabled>↵</button>
        </div>
      </div>
    </div>

    <!-- File Viewer Overlay -->
    <div id="fileViewer" class="overlay">
      <div class="overlay-header">
        <button class="btn-back" onclick="closeOverlay('fileViewer')">← 返回</button>
        <span class="overlay-title" id="fileViewerName"></span>
      </div>
      <pre class="file-viewer-content" id="fileViewerContent"></pre>
    </div>

    <!-- Diff Viewer Overlay -->
    <div id="diffViewer" class="overlay">
      <div class="overlay-header">
        <button class="btn-back" onclick="closeOverlay('diffViewer')">← 返回</button>
        <span class="overlay-title" id="diffViewerName"></span>
      </div>
      <div class="diff-content" id="diffViewerContent"></div>
    </div>

    <!-- Folder Picker Overlay -->
    <div id="folderPicker" class="overlay">
      <div class="fp-header">
        <button class="btn-back" onclick="closeFolderPicker()">✕</button>
        <h3>选择项目文件夹</h3>
      </div>
      <div class="fp-path" id="fpPath"></div>
      <div class="fp-roots" id="fpRoots"></div>
      <div class="fp-list" id="fpList">
        <div class="fp-loading">加载中...</div>
      </div>
      <div class="fp-footer">
        <button class="btn-manual" onclick="toggleManualInput()">手动输入</button>
        <button class="btn-select" id="fpSelectBtn" onclick="confirmSelectFolder()" disabled>选择此目录</button>
      </div>
      <div id="fpManualArea" style="display:none;padding:0 16px 10px;background:var(--bg-card);border-top:1px solid var(--border)">
        <div style="display:flex;gap:8px;padding:10px 0 0">
          <input type="text" id="fpManualInput" placeholder="输入文件夹绝对路径" style="flex:1;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text);font-size:14px;outline:none">
          <button onclick="manualAddProject()" style="padding:10px 18px;background:var(--accent);color:white;border:none;border-radius:var(--radius-xs);font-size:14px;cursor:pointer">导入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" id="sessionFab" onclick="createSession()">+</button>

  <!-- Bottom Tab Bar (3 tabs, Happy-style) -->
  <div class="tab-bar">
    <button class="tab-item active" onclick="switchTab('sessions', this)">
      <span class="tab-icon">💬</span><span class="tab-label">会话</span>
    </button>
    <button class="tab-item" onclick="switchTab('projects', this)">
      <span class="tab-icon">📂</span><span class="tab-label">项目</span>
    </button>
    <button class="tab-item" onclick="switchTab('settings', this)">
      <span class="tab-icon">⚙</span><span class="tab-label">设置</span>
    </button>
  </div>
</div>

<script src="xterm.min.js"></script>
<script src="xterm-addon-fit.min.js"></script>
<script>
(function() {
  'use strict';

  // ── State ──
  var ws = null;
  var term = null;
  var fitAddon = null;
  var currentSessionId = null;
  var currentFilePath = '/';
  var pingTimer = null;
  var savedToken = '';
  var currentTab = 'sessions';

  var projects = [];
  var activeProject = null;
  var sessions = [];
  var gitStatus = null;
  var gitChanges = null;
  var gitLogEntries = [];

  // Reconnect state
  var reconnectTimer = null;
  var reconnectDelay = 1000;
  var reconnectAttempts = 0;
  var maxReconnectAttempts = 10;
  var isManualDisconnect = false;

  // Folder picker state
  var fpCurrentPath = '';
  var fpDirRoots = [];

  // ── Connection ──

  window.doConnect = function() {
    var token = document.getElementById('tokenInput').value.trim();
    if (!token) { document.getElementById('loginError').textContent = '请输入令牌'; return; }

    var btn = document.getElementById('connectBtn');
    btn.disabled = true; btn.textContent = '连接中...';
    document.getElementById('loginError').textContent = '';
    savedToken = token;
    connectWS(token);
  };

  function connectWS(token) {
    if (!token) token = savedToken;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = proto + '//' + location.host + '/ws?token=' + encodeURIComponent(token);

    try { ws = new WebSocket(url); } catch(e) { showLoginError('无法建立连接'); return; }

    ws.onopen = function() {
      localStorage.setItem('rs-token', token);
      savedToken = token;
      showMainApp();
      startPing();
      updateConnStatus('connected');
      reconnectAttempts = 0;
      reconnectDelay = 1000;
      document.getElementById('settingsUrl').textContent = location.origin;
      document.getElementById('settingsToken').textContent = token.substring(0, 8) + '...';
      send({ type: 'session:list' });
      send({ type: 'project:list' });
    };

    ws.onmessage = function(e) { try { handleMessage(JSON.parse(e.data)); } catch(err) {} };

    ws.onclose = function(e) {
      stopPing();
      if (isManualDisconnect) {
        isManualDisconnect = false;
        showLogin();
        resetConnectBtn();
        return;
      }
      if (e.code === 1008 || e.code === 4011) {
        showLoginError('令牌无效');
        resetConnectBtn();
        return;
      }
      // Auto reconnect
      updateConnStatus('reconnecting');
      scheduleReconnect();
    };

    ws.onerror = function() {
      if (!document.getElementById('mainApp').style.display || document.getElementById('mainApp').style.display === 'none') {
        showLoginError('连接失败');
        resetConnectBtn();
      }
    };
  }

  function scheduleReconnect() {
    if (reconnectAttempts >= maxReconnectAttempts) {
      updateConnStatus('disconnected');
      return;
    }
    reconnectTimer = setTimeout(function() {
      reconnectAttempts++;
      updateConnStatus('reconnecting');
      connectWS();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  }

  window.doDisconnect = function() {
    isManualDisconnect = true;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws) { ws.close(); ws = null; }
    closeTerminal();
    showLogin();
    resetConnectBtn();
  };

  function updateConnStatus(status) {
    var el = document.getElementById('connStatus');
    var text = document.getElementById('connText');
    el.className = 'conn-status ' + status;
    if (status === 'connected') text.textContent = '已连接';
    else if (status === 'reconnecting') text.textContent = '重连中 (' + reconnectAttempts + '/' + maxReconnectAttempts + ')';
    else text.textContent = '已断开';
  }

  function showLoginError(msg) { document.getElementById('loginError').textContent = msg; }
  function resetConnectBtn() { var b = document.getElementById('connectBtn'); b.disabled = false; b.textContent = '连接'; }
  function showMainApp() { document.getElementById('loginPage').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex'; }
  function showLogin() { document.getElementById('loginPage').style.display = 'flex'; document.getElementById('mainApp').style.display = 'none'; }
  function send(msg) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }
  function startPing() { pingTimer = setInterval(function() { send({ type: 'ping' }); }, 30000); }
  function stopPing() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }

  // ── Toast ──
  var toastTimer = null;
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    clearTimeout(toastTimer);
    setTimeout(function() { t.classList.add('show'); }, 10);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  // ── Message Handling ──

  function handleMessage(msg) {
    switch (msg.type) {
      case 'session:list':
        sessions = msg.sessions || [];
        renderSessionList(sessions);
        break;
      case 'session:created':
        openTerminal(msg.session.id, msg.session.cwd);
        break;
      case 'session:connected': break;
      case 'session:data':
        if (term && msg.sessionId === currentSessionId) term.write(msg.data);
        break;
      case 'session:exited':
        if (msg.sessionId === currentSessionId && term) term.write('\r\n\x1b[90m[ 会话已退出 ]\x1b[0m\r\n');
        send({ type: 'session:list' });
        break;
      case 'session:error': showToast(msg.error || '会话错误', 'error'); break;
      case 'file:list': renderFileList(msg.path, msg.entries); break;
      case 'file:read': showFileContent(msg.path, msg.content); break;
      case 'file:error': showToast(msg.error || '文件错误', 'error'); break;
      case 'project:list': renderProjects(msg.projects); break;
      case 'project:added':
        projects.push(msg.project);
        renderProjects(projects);
        showToast('项目已添加: ' + msg.project.name, 'success');
        break;
      case 'project:removed':
        projects = projects.filter(function(p) { return p.path !== msg.path; });
        if (activeProject && activeProject.path === msg.path) { activeProject = null; updateActiveProjectUI(); }
        renderProjects(projects);
        break;
      case 'project:error': showToast(msg.error, 'error'); break;
      case 'git:status': gitStatus = msg.status; renderGitPanel(); break;
      case 'git:log': gitLogEntries = msg.entries; renderGitLog(); break;
      case 'git:staged':
      case 'git:unstaged':
        if (activeProject) {
          send({ type: 'git:status', workdir: activeProject.path });
          send({ type: 'git:fileChanges', workdir: activeProject.path });
        }
        break;
      case 'git:committed':
        showToast('提交成功: ' + msg.hash, 'success');
        if (activeProject) {
          send({ type: 'git:status', workdir: activeProject.path });
          send({ type: 'git:log', workdir: activeProject.path });
          send({ type: 'git:fileChanges', workdir: activeProject.path });
        }
        var cm = document.getElementById('commitMsg');
        if (cm) cm.value = '';
        break;
      case 'git:diff': showDiff(msg.filePath, msg.diff); break;
      case 'git:fileChanges': gitChanges = msg.result; renderGitPanel(); break;
      case 'git:error': showToast('Git 错误: ' + msg.error, 'error'); break;
      case 'command:started': send({ type: 'session:list' }); break;
      case 'dir:roots': fpDirRoots = msg.roots || []; renderFpRoots(); break;
      case 'dir:browse': renderFpList(msg.path, msg.dirs, msg.parent); break;
      case 'dir:error': showToast(msg.error, 'error'); break;
      case 'error': showToast(msg.message, 'error'); break;
    }
  }

  // ── Session List ──

  function renderSessionList(list) {
    sessions = list || [];
    var c = document.getElementById('sessionList');
    if (!sessions.length) {
      c.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>暂无会话</p><p class="hint">点击右下角 + 创建新会话</p></div>';
      return;
    }
    c.innerHTML = sessions.map(function(s) {
      var badge = s.isLocal
        ? '<span class="session-card-badge local">本地</span>'
        : '<span class="session-card-badge remote">远程</span>';
      var actions = !s.isLocal
        ? '<div class="session-card-actions"><button class="btn-destructive-sm" onclick="event.stopPropagation();destroySession(\'' + escAttr(s.id) + '\')">销毁</button></div>'
        : '';
      return '<div class="session-card" onclick="openTerminal(\'' + escAttr(s.id) + '\', \'' + escAttr(s.cwd) + '\')">' +
        '<div class="session-card-top">' +
          '<div class="session-card-icon">⌨</div>' +
          '<div class="session-card-info">' +
            '<div class="session-card-name">' + esc(s.id) + '</div>' +
            '<div class="session-card-path">' + esc(shortCwd(s.cwd)) + '</div>' +
          '</div>' +
          badge + actions +
        '</div>' +
      '</div>';
    }).join('');
    updateCommandBar();
  }

  window.createSession = function() {
    var cwd = activeProject ? activeProject.path : undefined;
    send({ type: 'session:create', cwd: cwd, cols: 80, rows: 24 });
  };

  window.destroySession = function(id) {
    send({ type: 'session:destroy', sessionId: id });
  };

  window.runCommand = function() {
    var cmd = document.getElementById('commandInput').value.trim();
    if (!cmd || !activeProject) return;
    send({ type: 'command:run', workdir: activeProject.path, command: cmd });
    document.getElementById('commandInput').value = '';
  };

  function updateCommandBar() {
    var input = document.getElementById('commandInput');
    var btn = document.getElementById('commandRunBtn');
    var enabled = !!activeProject;
    input.disabled = !enabled;
    btn.disabled = !enabled;
    input.placeholder = enabled ? '在 ' + activeProject.name + ' 中运行命令...' : '运行命令（需先选择项目）';
  }

  // ── Terminal ──

  window.openTerminal = function(sessionId, cwd) {
    currentSessionId = sessionId;
    var view = document.getElementById('terminalView');
    view.classList.add('active');
    document.getElementById('terminalPath').textContent = shortCwd(cwd);
    document.getElementById('terminalStatus').style.background = 'var(--success)';
    if (term) { term.dispose(); term = null; }

    var fontSize = window.innerWidth < 768 ? 13 : 14;
    term = new Terminal({
      cursorBlink: true, fontSize: fontSize,
      fontFamily: "'SF Mono','Fira Code','Consolas',monospace",
      theme: { background: '#0a0a0a', foreground: '#ededed', cursor: '#6366f1', selectionBackground: '#6366f144' },
      allowProposedApi: true,
    });
    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminalContainer'));
    setTimeout(function() { try { fitAddon.fit(); } catch(e) {} }, 80);
    term.onData(function(data) { send({ type: 'session:write', sessionId: sessionId, data: data }); });
    term.onResize(function(size) { send({ type: 'session:resize', sessionId: sessionId, cols: size.cols, rows: size.rows }); });
    send({ type: 'session:connect', sessionId: sessionId });
  };

  window.closeTerminal = function() {
    var view = document.getElementById('terminalView');
    view.classList.remove('active');
    if (currentSessionId) send({ type: 'session:disconnect', sessionId: currentSessionId });
    if (term) { term.dispose(); term = null; }
    currentSessionId = null;
  };

  // Composer
  window.sendSpecial = function(data) {
    if (currentSessionId) send({ type: 'session:write', sessionId: currentSessionId, data: data });
  };

  window.sendComposer = function() {
    var input = document.getElementById('composerInput');
    var cmd = input.value;
    if (!cmd || !currentSessionId) return;
    send({ type: 'session:write', sessionId: currentSessionId, data: cmd + '\n' });
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('composerSend').disabled = true;
  };

  // Resize handling
  window.addEventListener('resize', function() {
    if (fitAddon && term) try { fitAddon.fit(); } catch(e) {}
  });

  // Visual viewport for mobile keyboard
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      if (fitAddon && term) try { fitAddon.fit(); } catch(e) {}
    });
  }

  // ── Projects ──

  function renderProjects(list) {
    projects = list || [];
    var c = document.getElementById('projectList');
    if (!projects.length) {
      c.innerHTML = '<div class="empty-state"><div class="icon">📂</div><p>暂无项目</p><p class="hint">点击「导入项目」添加 Git 项目</p></div>';
      return;
    }
    c.innerHTML = projects.map(function(p, i) {
      var isSelected = activeProject && activeProject.path === p.path;
      var badge = p.isValid
        ? '<span class="project-card-badge valid">Git</span>'
        : '<span class="project-card-badge invalid">无效</span>';
      var detailId = 'projectDetail_' + i;
      return '<div class="project-card' + (isSelected ? ' selected' : '') + '" onclick="selectProject(' + i + ')">' +
        '<div class="project-card-top">' +
          '<span class="project-card-name">' + esc(p.name) + '</span>' + badge +
        '</div>' +
        '<div class="project-card-path">' + esc(p.path) + '</div>' +
        (isSelected ? '<div class="project-card-actions">' +
          '<button class="btn-xs" onclick="event.stopPropagation();createSessionInProject(\'' + escAttr(p.path) + '\')">⌨ 新建会话</button>' +
          '<button class="btn-xs" onclick="event.stopPropagation();browseProjectFiles(\'' + escAttr(p.path) + '\')">📁 文件</button>' +
        '</div>' : '') +
      '</div>' +
      (isSelected ? '<div class="project-detail active" id="' + detailId + '">' +
        '<div class="project-detail-tabs">' +
          '<button class="project-detail-tab active" onclick="switchDetailTab(this, \'git\')">Git</button>' +
          '<button class="project-detail-tab" onclick="switchDetailTab(this, \'files\')">文件</button>' +
        '</div>' +
        '<div class="project-detail-content" id="detailGit_' + i + '"></div>' +
        '<div class="project-detail-content" id="detailFiles_' + i + '" style="display:none"></div>' +
      '</div>' : '');
    }).join('');
  }

  window.selectProject = function(index) {
    var prev = activeProject;
    activeProject = projects[index];
    updateActiveProjectUI();
    renderProjects(projects);
    if (!prev || prev.path !== activeProject.path) {
      send({ type: 'git:status', workdir: activeProject.path });
      send({ type: 'git:log', workdir: activeProject.path });
      send({ type: 'git:fileChanges', workdir: activeProject.path });
      currentFilePath = activeProject.path;
    }
  };

  window.createSessionInProject = function(path) {
    send({ type: 'session:create', cwd: path, cols: 80, rows: 24 });
  };

  window.browseProjectFiles = function(path) {
    currentFilePath = path;
    send({ type: 'file:list', path: path });
    // Switch to files detail tab
    var tabs = document.querySelectorAll('.project-detail-tab');
    if (tabs.length >= 2) switchDetailTab(tabs[1], 'files');
  };

  window.switchDetailTab = function(el, tab) {
    var parent = el.closest('.project-detail');
    parent.querySelectorAll('.project-detail-tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    var i = activeProject ? projects.indexOf(activeProject) : -1;
    if (i < 0) return;
    var gitEl = document.getElementById('detailGit_' + i);
    var filesEl = document.getElementById('detailFiles_' + i);
    if (tab === 'git') {
      if (gitEl) gitEl.style.display = '';
      if (filesEl) filesEl.style.display = 'none';
    } else {
      if (gitEl) gitEl.style.display = 'none';
      if (filesEl) filesEl.style.display = '';
      if (activeProject) send({ type: 'file:list', path: currentFilePath });
    }
  };

  function updateActiveProjectUI() {
    updateCommandBar();
    document.getElementById('settingsProject').textContent = activeProject ? activeProject.name : '未选择';
  }

  // ── Git Panel (inside project detail) ──

  function renderGitPanel() {
    var i = activeProject ? projects.indexOf(activeProject) : -1;
    if (i < 0) return;
    var c = document.getElementById('detailGit_' + i);
    if (!c) return;
    if (!gitStatus) { c.innerHTML = '<div style="padding:16px;color:var(--text-dim);font-size:13px;text-align:center">加载中...</div>'; return; }

    var branch = gitStatus.current || 'HEAD';
    var ab = '';
    if (gitStatus.ahead > 0) ab += ' ↑' + gitStatus.ahead;
    if (gitStatus.behind > 0) ab += ' ↓' + gitStatus.behind;

    var html = '<div class="git-branch-bar">' +
      '<span>分支:</span> <span class="git-branch-name">' + esc(branch) + '</span>' +
      (ab ? '<span class="git-ahead-behind">' + ab + '</span>' : '') +
      (gitStatus.isClean ? '<span class="project-card-badge valid" style="font-size:11px;padding:2px 8px;border-radius:12px">干净</span>' : '<span class="project-card-badge invalid" style="font-size:11px;padding:2px 8px;border-radius:12px">有变更</span>') +
    '</div>';

    // Staged
    html += '<div class="section-label">已暂存</div>';
    if (gitChanges) {
      var staged = gitChanges.changes.filter(function(ch) { return ch.staged; });
      html += staged.length ? staged.map(function(ch) {
        return '<div class="git-file-item">' +
          '<span class="git-file-status ' + ch.status + '">' + ch.status + '</span>' +
          '<span class="git-file-path" onclick="showFileDiff(\'' + escAttr(ch.path) + '\', true)">' + esc(ch.path) + '</span>' +
          '<div class="git-file-actions"><button class="btn-outline-xs" onclick="unstageFile(\'' + escAttr(ch.path) + '\')">−</button></div>' +
        '</div>';
      }).join('') : '<div style="padding:6px 16px;color:var(--text-dim);font-size:12px">无暂存文件</div>';
    }

    // Unstaged
    html += '<div class="section-label">未暂存</div>';
    if (gitChanges) {
      var unstaged = gitChanges.changes.filter(function(ch) { return !ch.staged; });
      html += unstaged.length ? unstaged.map(function(ch) {
        return '<div class="git-file-item">' +
          '<span class="git-file-status ' + ch.status + '">' + ch.status + '</span>' +
          '<span class="git-file-path" onclick="showFileDiff(\'' + escAttr(ch.path) + '\', false)">' + esc(ch.path) + '</span>' +
          '<div class="git-file-actions"><button class="btn-outline-xs" onclick="stageFile(\'' + escAttr(ch.path) + '\')">+</button></div>' +
        '</div>';
      }).join('') : '<div style="padding:6px 16px;color:var(--text-dim);font-size:12px">无未暂存文件</div>';
    }

    // Commit
    html += '<div class="git-commit-area">' +
      '<textarea id="commitMsg" placeholder="输入提交信息..." onclick="event.stopPropagation()"></textarea>' +
      '<div class="commit-actions"><button class="btn-commit" onclick="doCommit()">提交</button></div>' +
    '</div>';

    // Log
    html += '<div class="section-label">提交历史</div><div id="gitLogContainer"></div>';

    c.innerHTML = html;
    renderGitLog();
  }

  function renderGitLog() {
    var c = document.getElementById('gitLogContainer');
    if (!c) return;
    if (!gitLogEntries || !gitLogEntries.length) {
      c.innerHTML = '<div style="padding:6px 16px;color:var(--text-dim);font-size:12px">无提交记录</div>';
      return;
    }
    c.innerHTML = gitLogEntries.map(function(e) {
      return '<div class="git-log-entry">' +
        '<span class="git-log-hash">' + esc(e.hash.substring(0, 7)) + '</span>' +
        '<div class="git-log-info">' +
          '<div class="git-log-msg">' + esc(e.message.split('\n')[0]) + '</div>' +
          '<div class="git-log-meta">' + esc(e.author_name) + ' · ' + relativeTime(e.date) + '</div>' +
        '</div></div>';
    }).join('');
  }

  window.stageFile = function(filePath) {
    if (!activeProject) return;
    send({ type: 'git:stage', workdir: activeProject.path, paths: [filePath] });
  };
  window.unstageFile = function(filePath) {
    if (!activeProject) return;
    send({ type: 'git:unstage', workdir: activeProject.path, paths: [filePath] });
  };
  window.doCommit = function() {
    if (!activeProject) return;
    var msg = document.getElementById('commitMsg');
    if (!msg) return;
    var message = msg.value.trim();
    if (!message) { showToast('请输入提交信息', 'error'); return; }
    send({ type: 'git:commit', workdir: activeProject.path, message: message });
  };
  window.showFileDiff = function(filePath, staged) {
    if (!activeProject) return;
    send({ type: 'git:diff', workdir: activeProject.path, filePath: filePath, staged: staged });
  };

  // ── File Browser (in project detail) ──

  function renderFileList(dirPath, entries) {
    currentFilePath = dirPath;
    var i = activeProject ? projects.indexOf(activeProject) : -1;
    var c = i >= 0 ? document.getElementById('detailFiles_' + i) : null;

    // If no active project detail panel, skip
    if (!c) return;

    entries = entries || [];
    entries.sort(function(a, b) {
      if (a.isDirectory && !b.isDirectory) return -1;
      if (!a.isDirectory && b.isDirectory) return 1;
      return a.name.localeCompare(b.name);
    });

    var parts = dirPath.replace(/\\/g, '/').split('/').filter(Boolean);
    var pathHtml = '<span onclick="navTo(\'/\')" style="cursor:pointer">/</span>';
    var acc = '';
    parts.forEach(function(p) {
      acc += '/' + p;
      pathHtml += '<span class="path-sep">/</span><span onclick="navTo(\'' + escAttr(acc) + '\')" style="cursor:pointer">' + esc(p) + '</span>';
    });

    var filesHtml = entries.length ? entries.map(function(e) {
      var icon = e.isDirectory ? '📂' : '📄';
      var cls = e.isDirectory ? 'dir-icon' : 'file-icon-default';
      var sz = e.isDirectory ? '' : fmtSize(e.size);
      var act = e.isDirectory
        ? 'onclick="navDir(\'' + escAttr(dirPath) + '\',\'' + escAttr(e.name) + '\')"'
        : 'onclick="readFile(\'' + escAttr(dirPath) + '\',\'' + escAttr(e.name) + '\')"';
      return '<div class="file-item" ' + act + '>' +
        '<span class="file-icon ' + cls + '">' + icon + '</span>' +
        '<span class="file-name">' + esc(e.name) + '</span>' +
        '<span class="file-size">' + sz + '</span></div>';
    }).join('') : '<div style="padding:16px;color:var(--text-dim);font-size:13px;text-align:center">目录为空</div>';

    c.innerHTML = '<div class="path-bar">' + pathHtml + '</div><div>' + filesHtml + '</div>';
  }

  window.navDir = function(base, name) {
    send({ type: 'file:list', path: base.replace(/\\/g,'/').replace(/\/$/,'') + '/' + name });
  };
  window.navTo = function(p) { send({ type: 'file:list', path: p }); };
  window.readFile = function(base, name) {
    send({ type: 'file:read', path: base.replace(/\\/g,'/').replace(/\/$/,'') + '/' + name });
  };

  // ── Overlays (diff, file viewer) ──

  function showDiff(filePath, diff) {
    var view = document.getElementById('diffViewer');
    view.classList.add('active');
    document.getElementById('diffViewerName').textContent = filePath;

    if (diff.isBinary) {
      document.getElementById('diffViewerContent').textContent = '（二进制文件，无法显示差异）';
      return;
    }

    var origLines = diff.original.split('\n');
    var modLines = diff.modified.split('\n');
    var html = '';

    if (diff.original === '' && diff.modified !== '') {
      html = modLines.map(function(l) { return '<div class="diff-line-added">+ ' + esc(l) + '</div>'; }).join('');
    } else if (diff.original !== '' && diff.modified === '') {
      html = origLines.map(function(l) { return '<div class="diff-line-removed">- ' + esc(l) + '</div>'; }).join('');
    } else {
      var origSet = new Set(origLines);
      var modSet = new Set(modLines);
      origLines.forEach(function(l) {
        if (!modSet.has(l) || modLines.indexOf(l) !== origLines.indexOf(l)) {
          html += '<div class="diff-line-removed">- ' + esc(l) + '</div>';
        }
      });
      modLines.forEach(function(l) {
        if (!origSet.has(l) || origLines.indexOf(l) !== modLines.indexOf(l)) {
          html += '<div class="diff-line-added">+ ' + esc(l) + '</div>';
        }
      });
      if (!html) html = modLines.map(function(l) { return '<div class="diff-line-context">  ' + esc(l) + '</div>'; }).join('');
    }
    document.getElementById('diffViewerContent').innerHTML = html;
  }

  function showFileContent(filePath, content) {
    var view = document.getElementById('fileViewer');
    view.classList.add('active');
    document.getElementById('fileViewerName').textContent = filePath.split(/[\/\\]/).pop();
    document.getElementById('fileViewerContent').textContent = content;
  }

  window.closeOverlay = function(id) {
    document.getElementById(id).classList.remove('active');
  };

  // ── Tab Switching ──

  window.switchTab = function(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById(tab + 'View').classList.add('active');

    // Show/hide FAB based on tab
    document.getElementById('sessionFab').style.display = tab === 'sessions' ? '' : 'none';

    if (tab === 'sessions') send({ type: 'session:list' });
    else if (tab === 'projects') send({ type: 'project:list' });
  };

  // ── Folder Picker ──

  window.showAddProject = function() {
    var view = document.getElementById('folderPicker');
    view.classList.add('active');
    document.getElementById('fpSelectBtn').disabled = true;
    fpCurrentPath = '';
    send({ type: 'dir:roots' });
  };

  window.closeFolderPicker = function() {
    document.getElementById('folderPicker').classList.remove('active');
    document.getElementById('fpManualArea').style.display = 'none';
  };

  function renderFpRoots() {
    var c = document.getElementById('fpRoots');
    c.innerHTML = fpDirRoots.map(function(r) {
      return '<div class="fp-root-chip" onclick="fpNavTo(\'' + escAttr(r.path) + '\')">' + esc(r.name) + '</div>';
    }).join('');
    if (fpDirRoots.length && !fpCurrentPath) fpNavTo(fpDirRoots[0].path);
  }

  function renderFpList(dirPath, dirs, parent) {
    fpCurrentPath = dirPath;
    var btn = document.getElementById('fpSelectBtn');
    btn.disabled = false;
    btn.textContent = '选择: ' + (dirPath.split(/[\/\\]/).filter(Boolean).pop() || dirPath);

    var parts = dirPath.replace(/\\/g, '/').split('/').filter(Boolean);
    var bcHtml = '';
    if (parent) bcHtml += '<span onclick="fpNavTo(\'' + escAttr(parent) + '\')">..</span>';
    if (parts.length > 3) {
      bcHtml += '<span style="color:var(--text-dim)">…</span>';
      parts.slice(-3).forEach(function(p) { bcHtml += '<span class="path-sep">/</span><span>' + esc(p) + '</span>'; });
    } else {
      parts.forEach(function(p, i) {
        if (i > 0) bcHtml += '<span class="path-sep">/</span>';
        bcHtml += '<span>' + esc(p) + '</span>';
      });
    }
    document.getElementById('fpPath').innerHTML = bcHtml;

    var c = document.getElementById('fpList');
    if (!dirs || !dirs.length) {
      c.innerHTML = '<div class="empty-state" style="padding:30px"><div class="icon">📂</div><p>此目录无子文件夹</p></div>';
      return;
    }
    c.innerHTML = dirs.map(function(d) {
      var gitBadge = d.hasGit ? '<span class="fp-item-badge">Git</span>' : '';
      var arrow = d.hasSubdirs ? '<span class="fp-item-arrow">›</span>' : '';
      return '<div class="fp-item" onclick="fpNavTo(\'' + escAttr(d.path) + '\')">' +
        '<span class="fp-item-icon">📂</span>' +
        '<span class="fp-item-name">' + esc(d.name) + '</span>' +
        gitBadge + arrow +
      '</div>';
    }).join('');
  }

  window.fpNavTo = function(p) {
    document.getElementById('fpList').innerHTML = '<div class="fp-loading">加载中...</div>';
    send({ type: 'dir:browse', path: p });
  };

  window.confirmSelectFolder = function() {
    if (!fpCurrentPath) return;
    send({ type: 'project:add', path: fpCurrentPath });
    window.closeFolderPicker();
  };

  window.toggleManualInput = function() {
    var area = document.getElementById('fpManualArea');
    area.style.display = area.style.display === 'none' ? 'block' : 'none';
    if (area.style.display !== 'none') document.getElementById('fpManualInput').focus();
  };

  window.manualAddProject = function() {
    var p = document.getElementById('fpManualInput').value.trim();
    if (!p) return;
    send({ type: 'project:add', path: p });
    document.getElementById('fpManualInput').value = '';
    window.closeFolderPicker();
  };

  // ── Utilities ──

  function shortCwd(cwd) { var p = cwd.split(/[\/\\]/).filter(Boolean); return p.slice(-2).join('/') || cwd; }
  function fmtSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  function relativeTime(dateStr) {
    var d = new Date(dateStr);
    var diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff/60) + '分钟前';
    if (diff < 86400) return Math.floor(diff/3600) + '小时前';
    if (diff < 2592000) return Math.floor(diff/86400) + '天前';
    return d.toLocaleDateString('zh-CN');
  }

  // ── Init ──

  window.addEventListener('load', function() {
    var saved = localStorage.getItem('rs-token');
    if (saved) {
      document.getElementById('tokenInput').value = saved;
      window.doConnect();
    } else {
      document.getElementById('tokenInput').focus();
    }

    // Input event listeners
    document.getElementById('tokenInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') window.doConnect();
    });
    document.getElementById('commandInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') window.runCommand();
    });
    document.getElementById('fpManualInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') window.manualAddProject();
    });

    // Composer input handling
    var composerInput = document.getElementById('composerInput');
    composerInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
      document.getElementById('composerSend').disabled = !this.value.trim();
    });
    composerInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        window.sendComposer();
      }
    });
  });

})();
</script>
</body>
</html>
